<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NSM console</title>
<!--
  Single-pane console for the ER4/Malcolm deployment.

  SERVED BY MALCOLM'S OWN NGINX, which is the whole design.  Dropping this file
  into the static root means it is same-origin with /mapi/, /arkime/ and the
  OpenSearch console proxy, so the BROWSER is the query client: live drill-down
  with no new service, no new port and no new process on a host that has no
  memory headroom to give one.

  Two data sources, deliberately different:

    status.json  - written by tools/dashboard-status.py.  Pipeline health:
                   memory, watcher threads, queue depth, 9p latency, snapshots.
                   None of it exists in any index, which is exactly why neither
                   Arkime nor OpenSearch Dashboards can show it.
    live queries - the session index, through the console proxy.  Network
                   behaviour, and every drill-down.

  THIS FILE IS COMMITTED AND THE REPO IS PUBLIC, so it contains no addresses, no
  hostnames and no data - only the code that fetches them at runtime.

  A FAILED QUERY MUST NOT LOOK LIKE AN EMPTY RESULT.  This deployment's recurring
  lesson is that aggregations return 0 rather than erroring, so every panel here
  distinguishes "no data" from "the query failed" and says which.
-->
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#293241; --ink:#e6edf3; --dim:#8b949e;
    --ok:#3fb950; --warn:#d29922; --bad:#f85149; --accent:#58a6ff; --mute:#6e7681;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
  header{position:sticky;top:0;z-index:20;background:#0d1117ee;backdrop-filter:blur(6px);
         border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  h1{font-size:14px;margin:0;letter-spacing:.5px;font-weight:600}
  .pill{padding:2px 9px;border-radius:10px;font-size:11px;font-weight:600;border:1px solid}
  .pill.ok{color:var(--ok);border-color:#2ea04366;background:#2ea04318}
  .pill.warn{color:var(--warn);border-color:#d2992266;background:#d2992218}
  .pill.bad{color:var(--bad);border-color:#f8514966;background:#f8514918}
  .spacer{flex:1}
  .muted{color:var(--dim)}
  main{padding:16px;display:grid;gap:14px}
  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
  .card h2{font-size:11px;margin:0 0 10px;color:var(--dim);text-transform:uppercase;letter-spacing:.9px;
           font-weight:600;display:flex;align-items:center;gap:8px}
  .big{font-size:24px;font-weight:600;line-height:1.1}
  .sub{font-size:11px;color:var(--dim);margin-top:2px}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{text-align:left;color:var(--dim);font-weight:500;padding:3px 6px 5px;border-bottom:1px solid var(--line);
     font-size:10px;text-transform:uppercase;letter-spacing:.6px}
  td{padding:3px 6px;border-bottom:1px solid #21262d}
  tr[data-drill]{cursor:pointer}
  tr[data-drill]:hover{background:#1f6feb22}
  .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .bar{height:3px;background:var(--accent);border-radius:2px;min-width:1px;opacity:.65}
  .tag{font-size:9px;padding:1px 5px;border-radius:8px;background:#30363d;color:var(--dim);margin-left:6px;
       text-transform:uppercase;letter-spacing:.5px}
  .tag.obs{background:#1f6feb33;color:var(--accent)}
  .err{color:var(--bad);font-size:11px;padding:6px 0}
  .empty{color:var(--mute);font-size:11px;padding:6px 0;font-style:italic}
  .kv{display:flex;justify-content:space-between;gap:10px;padding:2px 0;font-size:12px}
  .kv b{font-weight:600}
  select,button{background:#21262d;color:var(--ink);border:1px solid var(--line);border-radius:6px;
                padding:3px 8px;font:inherit;font-size:12px;cursor:pointer}
  button:hover,select:hover{border-color:var(--accent)}
  #drill{position:fixed;inset:auto 0 0 0;height:62vh;background:var(--panel);border-top:2px solid var(--accent);
         z-index:40;overflow:auto;padding:14px 18px;display:none;box-shadow:0 -12px 40px #0009}
  #drill.open{display:block}
  #drill h3{margin:0 0 4px;font-size:14px}
  .close{position:absolute;top:12px;right:16px}
  .spark{display:block;width:100%;height:34px}
  .flag{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle}
  .flag.ok{background:var(--ok)} .flag.warn{background:var(--warn)} .flag.bad{background:var(--bad)}
  .stale{color:var(--warn)}
  code{background:#21262d;padding:1px 4px;border-radius:3px;font-size:11px}

  /* Status carries a GLYPH and a WORD, never colour alone. The palette
     validator measures warn(amber) against ok(green) at only ΔE 5.1 under
     protanopia - indistinguishable for a red-blind reader - which is allowed
     only with secondary encoding. The glyph is that encoding, not decoration. */
  .st{font-weight:600;white-space:nowrap}
  .st.ok{color:var(--ok)} .st.warn{color:var(--warn)} .st.bad{color:var(--bad)}
  .st::before{margin-right:5px;font-size:11px}
  .st.ok::before{content:"●"} .st.warn::before{content:"▲"} .st.bad::before{content:"✕"}

  /* The banner is the hero: one line answering "is anything wrong", at a size
     that does not have to compete with thirteen equal panels. */
  #banner{padding:14px 16px 0;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
  #banner .hero{font-size:20px;font-weight:600;letter-spacing:-.2px}
  #banner .why{color:var(--dim);font-size:12px}

  /* KPI row: a healthy subsystem costs one tile, not a whole card. */
  .kpirow{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 11px;cursor:pointer}
  .kpi:hover{border-color:var(--accent)}
  .kpi .k{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px}
  .kpi .v{font-size:17px;font-weight:600;margin:2px 0 1px;font-variant-numeric:tabular-nums}
  .kpi .s{font-size:11px}
  .delta{font-size:10px;font-weight:600;margin-left:6px;padding:1px 5px;border-radius:8px;vertical-align:middle}
  .delta.better{color:var(--ok);background:#2ea04318}
  .delta.worse{color:var(--warn);background:#d2992218}
  .delta.flat{color:var(--mute);background:#30363d55}
  .tspark{display:block;width:100%;height:16px;margin:1px 0 2px}
  .kpi.problem{border-color:var(--warn)}
  .kpi.critical{border-color:var(--bad)}
  h2.sect{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1.2px;
          margin:6px 0 -4px;padding-bottom:5px;border-bottom:1px solid var(--line);font-weight:600}
  .gl{border-bottom:1px dotted var(--dim);cursor:help}
  .gl:hover{border-bottom-color:var(--accent);color:var(--accent)}
  .tip{position:fixed;pointer-events:none;line-height:1.5;background:#21262d;border:1px solid var(--line);
       border-radius:5px;padding:4px 7px;font-size:11px;z-index:60;display:none;white-space:nowrap}
</style>
</head>
<body>
<header>
  <h1>NSM CONSOLE</h1>
  <span id="verdict" class="pill warn">starting</span>
  <span class="muted" id="age">-</span>
  <span class="spacer"></span>
  <label class="muted">window
    <select id="range">
      <option value="1h">1h</option>
      <option value="6h">6h</option>
      <option value="24h" selected>24h</option>
      <option value="7d">7d</option>
    </select>
  </label>
  <button id="refresh">refresh</button>
  <a href="/arkime/" target="_blank">Arkime</a>
  <a href="/dashboards/" target="_blank">Dashboards</a>
</header>

<div id="banner"><span class="hero">checking…</span></div>
<main>
  <section class="kpirow" id="kpi"></section>
  <section class="grid" id="health"></section>
  <h2 class="sect">now</h2>
  <section class="grid" id="now"></section>
  <h2 class="sect">analysis</h2>
  <section class="grid" id="network"></section>
</main>
<div class="tip" id="tip"></div>

<div id="drill">
  <button class="close" onclick="closeDrill()">close</button>
  <h3 id="drill-title">-</h3>
  <div class="muted" id="drill-sub"></div>
  <div id="drill-body" style="margin-top:12px"></div>
</div>

<script>
"use strict";
const IDX = "arkime_sessions3-*";
let STATUS = null, RANGE = "24h", timer = null, tick = null;

/* ---------- helpers ------------------------------------------------------ */
/* Returns ALL roots, not just the first.
   The obvious one-liner (`d.innerHTML = h; return d.firstChild`) silently drops
   every element after the first, so a card built from one multi-element string
   rendered its headline and quietly discarded the numbers underneath it - no
   error, no gap, just missing information. A <template> also parses table rows
   correctly, which a <div> wrapper does not. */
const el = (h) => {
  const t = document.createElement("template");
  t.innerHTML = h.trim();
  return t.content.childElementCount === 1 ? t.content.firstElementChild : t.content;
};
const esc = (s) => String(s ?? "").replace(/[<>&"]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
const bytes = (n) => {
  if (n == null) return "-";
  const u = ["B","KB","MB","GB","TB"]; let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return n.toFixed(n < 10 && i > 0 ? 1 : 0) + " " + u[i];
};
const dur = (s) => {
  if (s == null || s < 0) return "-";
  if (s < 90) return s + "s";
  if (s < 5400) return Math.round(s / 60) + "m";
  if (s < 172800) return (s / 3600).toFixed(1) + "h";
  return (s / 86400).toFixed(1) + "d";
};

/* Query OpenSearch through the console proxy. Same-origin, so the basic-auth
   credentials the browser already holds for this page are reused - no token
   handling, no CORS, no second login. */
async function es(path, body) {
  const url = `/dashboards/api/console/proxy?path=${encodeURIComponent(path)}&method=POST`;
  const r = await fetch(url, {
    method: "POST", credentials: "same-origin",
    headers: { "osd-xsrf": "true", "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!r.ok) throw new Error("HTTP " + r.status);
  const j = await r.json();
  if (j.error) throw new Error(j.error.type || "query error");
  return j;
}

const timeFilter = () => ({ range: { "@timestamp": { gte: "now-" + RANGE } } });

/* Every panel routes through this so a FAILED query can never be mistaken for
   an empty one. Aggregations here return 0 buckets rather than erroring when a
   field is mapped wrong, and that has manufactured false conclusions before. */
async function panel(node, fn) {
  try {
    const out = await fn();
    node.innerHTML = "";
    node.append(out);
  } catch (e) {
    node.innerHTML = `<div class="err">query failed: ${esc(e.message)}</div>`;
  }
}

function table(cols, rows, opts = {}) {
  if (!rows.length) { const d = document.createElement("div"); d.className = "empty"; d.textContent = opts.empty || "no data in this window"; return d; }
  const max = Math.max(...rows.map(r => Number(r.bar) || 0), 1);
  const t = document.createElement("table");
  t.innerHTML = `<thead><tr>${cols.map(c => `<th class="${c.num ? "num" : ""}">${c.rawHead ? c.label : esc(c.label)}</th>`).join("")}</tr></thead>`;
  const tb = document.createElement("tbody");
  for (const r of rows) {
    const tr = document.createElement("tr");
    if (r.drill) { tr.dataset.drill = "1"; tr.onclick = () => openDrill(r.drill.field, r.drill.value); }
    tr.innerHTML = cols.map(c => {
      const v = r[c.key];
      return `<td class="${c.num ? "num" : ""}">${c.raw ? v : esc(v)}</td>`;
    }).join("");
    tb.append(tr);
    if (r.bar != null) {
      const b = document.createElement("tr");
      b.innerHTML = `<td colspan="${cols.length}" style="padding:0 6px 4px;border:0">
        <div class="bar" style="width:${(100 * r.bar / max).toFixed(1)}%"></div></td>`;
      tb.append(b);
    }
  }
  t.append(tb);
  return t;
}

/* A plotted series ships with a hover layer by default - a line you cannot
   interrogate is a decoration. Crosshair plus a tooltip naming the value and
   the time, with a hit target far wider than the 1.4px stroke. */
function sparkline(points, floor, unit) {
  if (points.length < 2) return el(`<div class="empty">not enough samples yet</div>`);
  const xs = points.map(p => p[0]), ys = points.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const y1 = Math.max(...ys, floor || 0) * 1.05, y0 = 0;
  const px = (x) => ((x - x0) / Math.max(1, x1 - x0)) * 100;
  const py = (y) => 100 - ((y - y0) / Math.max(1, y1 - y0)) * 100;
  const d = points.map((p, i) => `${i ? "L" : "M"}${px(p[0]).toFixed(2)},${py(p[1]).toFixed(2)}`).join(" ");
  /* The floor line is labelled, not just coloured red - a dashed line the
     reader has to guess the meaning of is worse than no line. */
  const fl = floor ? `<line x1="0" y1="${py(floor).toFixed(2)}" x2="100" y2="${py(floor).toFixed(2)}"
                       stroke="var(--bad)" stroke-width="0.8" stroke-dasharray="2,2" vector-effect="non-scaling-stroke"/>` : "";
  const svg = el(`<svg class="spark" viewBox="0 0 100 100" preserveAspectRatio="none">
    ${fl}<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.4" vector-effect="non-scaling-stroke"/>
    <line class="cx" x1="0" y1="0" x2="0" y2="100" stroke="var(--dim)" stroke-width="0.6"
          vector-effect="non-scaling-stroke" style="display:none"/>
    <rect x="0" y="0" width="100" height="100" fill="transparent"/></svg>`);
  const tip = document.getElementById("tip"), cx = svg.querySelector(".cx");
  svg.addEventListener("mousemove", (e) => {
    const r = svg.getBoundingClientRect();
    const frac = (e.clientX - r.left) / r.width;
    const tx = x0 + frac * (x1 - x0);
    let best = points[0];
    for (const p of points) if (Math.abs(p[0] - tx) < Math.abs(best[0] - tx)) best = p;
    cx.style.display = ""; cx.setAttribute("x1", px(best[0])); cx.setAttribute("x2", px(best[0]));
    tip.style.display = "block";
    tip.style.left = (e.clientX + 12) + "px"; tip.style.top = (e.clientY - 28) + "px";
    tip.textContent = `${best[1].toLocaleString()} ${unit || ""} · ${new Date(best[0] * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}`;
  });
  svg.addEventListener("mouseleave", () => { tip.style.display = "none"; cx.style.display = "none"; });
  if (floor) {
    const wrap = document.createDocumentFragment();
    wrap.append(svg);
    wrap.append(el(`<div class="sub" style="margin-top:-2px"><span style="color:var(--bad)">--</span> floor ${floor.toLocaleString()} ${esc(unit || "")}</div>`));
    return wrap;
  }
  return svg;
}

function card(title, extra = "") {
  const c = el(`<div class="card"><h2>${esc(title)}${extra}</h2><div class="body"></div></div>`);
  return { card: c, body: c.querySelector(".body") };
}

/* ---------- pipeline health (from status.json) ---------------------------
   PROGRESSIVE DISCLOSURE, not thirteen equal panels.

   The first version gave a healthy subsystem exactly as much space, colour and
   visual weight as a broken one, so a dead watcher thread sat in the same
   grid as five cards saying "fine" and nothing stood out. Everything shouting
   equally is the same as nothing shouting.

   So each subsystem computes a state and a one-line summary. Healthy ones
   collapse to a KPI tile; only the ones in warn/bad expand into a full card,
   and the banner states the worst of them in a sentence. On a good day the
   whole health section is one row - which is the point. Clicking any tile
   expands it anyway, so nothing is hidden, only de-emphasised. */
const STATE_RANK = { ok: 0, warn: 1, bad: 2 };

/* Change over the series, phrased so the direction is readable without knowing
   whether up is good. "goodDown" says which way is healthy for this measure. */
function deltaOf(series, fmt, goodDown) {
  if (!series || series.length < 4) return {};
  const a = series[0][1], b = series[series.length - 1][1];
  const d = b - a;
  if (!a || Math.abs(d) / Math.max(1, Math.abs(a)) < 0.05) return { delta: "steady", deltaDir: "flat" };
  const worse = goodDown ? d > 0 : d < 0;
  return { delta: (d > 0 ? "+" : "") + fmt(d), deltaDir: worse ? "worse" : "better" };
}
let FORCE_OPEN = {};

function statusEl(state, word) { return `<span class="st ${state}">${esc(word)}</span>`; }

/* GLOSSARY.
   Nearly every label on this page is insider vocabulary - "queue-wedged
   zeek-logs_upload", "settle window", "head age", "peak". Each one is a
   compressed reference to a failure this deployment actually had, and it is
   meaningless to anyone who was not there for it. A dashboard whose labels
   require the author to explain them is not readable; it is a private notebook.
   Hover any dotted term for the explanation. */
const GLOSS = {
  "thread-lost": "A watcher process lost one of its threads and stopped draining its queue. The container stays healthy and logs nothing, so this is invisible to docker. The watchdog restarts the service, which brings the thread back.",
  "queue-wedged": "A spool directory stopped draining and the consumer produced no events at all, so the watchdog restarted it. Different from a backlog: a deep queue that is moving is fine and gets left alone.",
  "zeek-logs_upload": "The queue where Zeek drops its log tarballs for filebeat to unpack and index. If it stops draining, network metadata stops reaching the index while packet capture carries on regardless.",
  "pcap_upload": "The queue where freshly captured pcap files land before the mover takes them to be analysed. Stalls here mean traffic is on disk but nothing is looking at it.",
  "verification-test": "A forensics dump taken by hand to check the collection works, not a real incident.",
  "filter-check": "A forensics dump taken by hand while fixing the probe's process matching, not a real incident.",
  "head age": "How old the OLDEST waiting item is - taken from the capture timestamp in its filename, NOT how long it has been queued. The repair for a stuck queue re-presents old files under their original names, so a capture from hours ago can read as hours old while moving perfectly well. mtime is not used because that repair rewrites it.",
  "settle window": "How long a file must sit unchanged before the watcher treats it as finished being written (10s). If one directory scan takes longer than this, the watcher is late by construction - and that looks exactly like a silent stall.",
  "p95 directory scan": "The 95th-percentile time to list the capture directory on the Windows bind mount. That filesystem is 60-100x slower than local disk and degrades badly under load. Scan cost grows with the FILE COUNT, so it gets worse as the archive fills.",
  "peak": "The highest thread count seen while this watcher was demonstrably working. Learned, never hardcoded - and only from a healthy observation, because a baseline sampled during a fault is not a baseline.",
  "publisher": "Announces newly arrived captures to Zeek, Suricata and Arkime over ZMQ. When it stops, files keep moving across the disk but nothing analyses them.",
  "mover": "Moves captures from the upload directory to the processed directory. When it stops, captures pile up in upload.",
  "zeek-extract": "Unpacks the Zeek log tarballs so filebeat can index them.",
  "quarantine": "Captures that could not be split or read at all. Nothing polls this directory, so anything here is unanalysed - it should normally be empty.",
  "observer": "This destination is the monitoring's own traffic - an agent session or remote shell egressing from the network it is watching. Unlabelled it is usually the largest upload destination on the page and reads exactly like exfiltration.",
  "unassigned shards": "Index data that is currently unavailable. On this deployment the usual cause is the host running out of memory, which OpenSearch reports as a corrupt index rather than as an out-of-memory error.",
  "snapshots": "Point-in-time copies of the indices. A corrupted index cannot be repaired, only deleted - so a snapshot is the difference between losing an afternoon of sessions and losing all of them.",
  "stalls healed": "Each entry is one incident the watchdog detected and repaired automatically, with a forensics dump taken BEFORE the repair - because restarting the fault is what destroyed the evidence for months.",
  "available": "Memory the kernel says it could hand out, INCLUDING page cache it would have to reclaim first. It can look healthy while free memory is nearly exhausted.",
  "free": "Memory that is immediately free right now. Watched alongside available because reclaiming cache here means reading back from a filesystem 60-100x slower than local disk.",
};

/* Wrap a term so it is visibly hoverable. Marked with a dotted underline: an
   explanation nobody can tell is there does not help anyone. */
function hint(text, key) {
  const k = (key || text).toLowerCase();
  const g = GLOSS[k] || Object.entries(GLOSS).find(([kk]) => k.includes(kk))?.[1];
  if (!g) return esc(text);
  return `<span class="gl" data-g="${esc(g)}">${esc(text)}</span>`;
}

/* One delegated listener rather than one per element - the health section is
   re-rendered on every refresh tick. */
document.addEventListener("mouseover", (e) => {
  const t = e.target.closest?.(".gl");
  const tip = document.getElementById("tip");
  if (!t) return;
  tip.style.display = "block";
  tip.style.whiteSpace = "normal";
  tip.style.maxWidth = "340px";
  tip.textContent = t.dataset.g;
  const r = t.getBoundingClientRect();
  tip.style.left = Math.min(r.left, window.innerWidth - 360) + "px";
  tip.style.top = (r.bottom + 8) + "px";
});
document.addEventListener("mouseout", (e) => {
  if (e.target.closest?.(".gl")) document.getElementById("tip").style.display = "none";
});

/* Each entry returns: state, a headline value, a one-line reason, and a
   detail() that builds the full card only when it is actually needed. */
function healthItems() {
  const s = STATUS, out = [];
  if (!s) return out;

  { /* memory */
    const m = s.mem, t = s.trend || {}, lead = s.config?.mem_lead_mins ?? 30;
    const soon = [t.avail_eta_min, t.free_eta_min].filter(v => v >= 0 && v <= lead);
    const state = m.avail_mb < m.floor_avail_mb ? "bad"
                : (m.free_mb < m.floor_free_mb || soon.length) ? "warn" : "ok";
    const why = m.avail_mb < m.floor_avail_mb ? "at the floor - this is what corrupts an index"
              : m.free_mb < m.floor_free_mb ? `only ${m.free_mb} MB free; reclaim is off a slow filesystem`
              : soon.length ? `reaches its floor in ~${Math.min(...soon)}m at the current slope`
              : "not falling";
    const memSeries = (t.samples || []).map(x => [x[0], x[1]]);
    out.push({ key: "memory", label: "host memory", state, why, hintKey: "available",
      value: `${(m.avail_mb / 1024).toFixed(1)} GB`, unit: "available",
      series: memSeries,
      ...deltaOf(memSeries, (d) => `${(d / 1024).toFixed(1)} GB`, false),
      detail: () => {
        const d = document.createDocumentFragment();
        d.append(el(`<div class="sub">${m.free_mb} MB free (floor ${m.floor_free_mb}) &middot; swap ${m.swap_pct}% &middot; available floor ${m.floor_avail_mb} MB</div>`));
        d.append(sparkline((t.samples || []).map(x => [x[0], x[1]]), m.floor_avail_mb, "MB available"));
        d.append(el(`<div class="sub">${esc(why)}</div>`));
        const c = s.consumers || [];
        if (c.length) {
          /* Emphasis, not a rainbow: the largest consumer is the story, the
             rest are context. One accent hue, everything else recessive. */
          d.append(el(`<div class="sub" style="margin-top:6px">largest consumers</div>`));
          d.append(table([{ key: "n", label: "container" }, { key: "m", label: "MB", num: true }],
            c.slice(0, 5).map((x, i) => ({ n: x.name, m: x.mb.toLocaleString(), bar: i === 0 ? x.mb : null }))));
        }
        return d;
      } });
  }

  { /* watchers */
    const w = s.watchers || [], down = w.filter(x => x.degraded);
    const state = down.length ? "bad" : w.some(x => x.age_sec < 120) ? "warn" : "ok";
    out.push({ key: "watchers", label: "watchers", state, hintKey: "peak",
      value: `${w.length - down.length}/${w.length}`, unit: "healthy",
      why: down.length ? `${down.map(x => x.role).join(", ")} lost a thread - the queue stops draining`
         : w.some(x => x.age_sec < 120) ? "a watcher is still starting" : "all threads present",
      detail: () => table(
        [{ key: "role", label: "watcher", raw: true }, { key: "th", label: "threads / peak", num: true, raw: true },
         { key: "up", label: "uptime", num: true }, { key: "st", label: "state", raw: true }],
        w.map(x => ({ role: hint(x.role, x.role),
          th: `${x.threads}${x.peak ? " / " + hint(String(x.peak), "peak") : ""}`, up: dur(x.age_sec),
          st: statusEl(x.degraded ? "bad" : x.age_sec < 120 ? "warn" : "ok",
                       x.degraded ? "thread lost" : x.age_sec < 120 ? "starting" : "ok") }))) });
  }

  { /* queues */
    const q = s.queues || [];
    const quar = q.find(x => x.name === "quarantine");
    const old = q.filter(x => x.pending > 0 && x.head_age_sec > 900);
    const state = (quar && quar.pending > 0) ? "warn" : old.length ? "warn" : "ok";
    const qSeries = ((s.fs || {}).history || []).map(h => [h[0], h[2]]);
    out.push({ key: "queues", label: "spool queues", state, hintKey: "quarantine",
      value: q.reduce((a, x) => a + x.pending, 0), unit: "pending",
      series: qSeries,
      ...deltaOf(qSeries, (d) => `${Math.round(d)}`, true),
      why: (quar && quar.pending > 0) ? `${quar.pending} capture(s) in quarantine - unanalysed`
         : old.length ? `${old[0].name} head is ${dur(old[0].head_age_sec)} old` : "everything draining",
      detail: () => table(
        [{ key: "name", label: "queue", raw: true }, { key: "p", label: "pending", num: true },
         { key: "age", label: hint("head age", "head age"), num: true, rawHead: true }, { key: "st", label: "state", raw: true }],
        q.map(x => ({ name: hint(x.name, x.name), p: x.pending, age: x.head_age_sec >= 0 ? dur(x.head_age_sec) : "-",
          st: statusEl(x.pending === 0 ? "ok" : x.head_age_sec > 900 ? "warn" : "ok",
                       x.pending === 0 ? "empty" : x.head_age_sec > 900 ? "head is old" : "moving") }))) });
  }

  { /* filesystem */
    const f = s.fs || {};
    const state = !f.available ? "warn"
                : f.projected_p95_s > f.settle_sec ? "warn"
                : f.listdir_p95_ms > f.settle_sec * 1000 ? "warn" : "ok";
    const fsSeries = (f.history || []).map(h => [h[0], h[1]]);
    out.push({ key: "fs", label: "scan latency", state, hintKey: "p95 directory scan",
      value: f.available ? `${(f.listdir_p95_ms / 1000).toFixed(1)}s` : "-", unit: "p95 directory scan",
      series: fsSeries,
      ...deltaOf(fsSeries, (d) => `${Math.round(d)} ms`, true),
      why: !f.available ? "stall probe not running - tools/stall-probe start"
         : f.projected_p95_s > f.settle_sec
           ? `projects to ${f.projected_p95_s}s at full retention, past the ${f.settle_sec}s settle window`
           : `inside the ${f.settle_sec}s settle window`,
      detail: () => el(`<div>
        <div class="sub">p50 ${f.listdir_p50_ms} ms &middot; max ${f.listdir_max_ms} ms &middot; ${f.entries} entries</div>
        <div class="sub">${f.over_settle}/${f.samples} scans exceeded the ${f.settle_sec}s settle window</div>
        <div class="sub">at the ${f.retain_files}-file retention steady state, p95 projects to
          <b class="${f.projected_p95_s > f.settle_sec ? "st warn" : "st ok"}">${f.projected_p95_s}s</b></div>
        <div class="sub">Past the settle window the watcher is late by construction, and that
          presents exactly like a silent stall.</div></div>`) });
  }

  { /* index + snapshots */
    const cl = s.cluster || {}, sn = s.snapshots || {};
    const stale = sn.available && sn.latest_age_sec > 172800;
    const state = !cl.reachable ? "bad" : cl.status === "red" ? "bad"
                : (cl.status !== "green" || stale || !sn.available) ? "warn" : "ok";
    out.push({ key: "index", label: "index & recovery", state, hintKey: "snapshots",
      value: cl.reachable ? (cl.docs || 0).toLocaleString() : "-", unit: "documents",
      why: !cl.reachable ? "cluster unreachable"
         : cl.status !== "green" ? `cluster ${cl.status}, ${cl.unassigned} shard(s) unassigned`
         : !sn.available ? "no snapshot repository - tools/snapshot init"
         : stale ? `newest snapshot is ${dur(sn.latest_age_sec)} old`
         : `green, newest snapshot ${dur(sn.latest_age_sec)} old`,
      detail: () => el(`<div>
        <div class="kv"><span>cluster</span>${statusEl(cl.status === "green" ? "ok" : cl.status === "red" ? "bad" : "warn", cl.status || "unreachable")}</div>
        <div class="kv"><span>unassigned shards</span><b>${cl.unassigned ?? "-"}</b></div>
        <div class="kv"><span>index size</span><b>${cl.size_gb ?? "-"} GB</b></div>
        <div class="kv"><span>snapshots</span><b>${sn.successful ?? 0}</b></div>
        <div class="kv"><span>newest</span><b>${dur(sn.latest_age_sec)} ago</b></div>
        <div class="sub">A corrupted index cannot be repaired, only restored.
          Prove it works: <code>tools/snapshot verify</code></div></div>`) });
  }

  { /* incidents */
    const inc = s.incidents || [];
    const now = Date.now() / 1000;
    const recent = inc.filter(i => now - i.t < 3600).length;
    out.push({ key: "stalls", label: "stalls healed", hintKey: "stalls healed", state: recent > 3 ? "warn" : "ok",
      value: inc.length, unit: recent ? `${recent} in the last hour` : "all time",
      why: recent > 3 ? `${recent} in the last hour - well above the usual rate`
         : inc.length ? `most recent ${dur(Math.round(now - inc[inc.length - 1].t))} ago` : "none recorded",
      detail: () => {
        const by = {};
        inc.forEach(i => { const k = i.label.replace(/^(thread-lost|queue-wedged)-/, "$1 "); by[k] = (by[k] || 0) + 1; });
        const d = document.createDocumentFragment();
        /* Each kind is compressed jargon for a specific failure - annotate both
           halves ("queue-wedged" and which queue) rather than leaving the reader
           to decode "queue-wedged zeek-logs_upload". */
        d.append(table([{ key: "k", label: "kind", raw: true }, { key: "n", label: "count", num: true }],
          Object.entries(by).sort((x, y) => y[1] - x[1]).map(([k, n]) => {
            const parts = k.split(" ");
            return { k: parts.map(w => hint(w, w)).join(" "), n, bar: n };
          })));
        d.append(el(`<div class="sub">each one is a forensics dump taken before the repair, in <code>$STATE_DIR/forensics</code></div>`));
        return d;
      } });
  }
  return out;
}

function renderHealth() {
  const kpi = document.getElementById("kpi"), host = document.getElementById("health");
  const banner = document.getElementById("banner");
  kpi.innerHTML = ""; host.innerHTML = "";

  if (!STATUS) {
    banner.innerHTML = `<span class="hero st bad">status feed unavailable</span>
      <span class="why">is <code>tools/dashboard status</code> running?</span>`;
    return;
  }

  const items = healthItems();
  const worst = items.reduce((a, i) => Math.max(a, STATE_RANK[i.state]), 0);
  const bad = items.filter(i => i.state !== "ok").sort((a, b) => STATE_RANK[b.state] - STATE_RANK[a.state]);

  /* One sentence, worst first. Not a count of panels - what is wrong and why. */
  banner.innerHTML = bad.length
    ? `<span class="hero st ${bad[0].state}">${esc(bad[0].label)}: ${esc(bad[0].why)}</span>` +
      (bad.length > 1 ? `<span class="why">and ${bad.length - 1} other${bad.length > 2 ? "s" : ""}: ${
        esc(bad.slice(1).map(i => i.label).join(", "))}</span>` : "")
    : `<span class="hero st ok">pipeline healthy</span><span class="why">${
        esc(items.map(i => i.label + " " + String(i.value) + " " + i.unit).slice(0, 3).join(" &middot; ").replace(/&middot;/g, "·"))}</span>`;

  for (const it of items) {
    /* A level with no history cannot tell you whether it is a spike or the new
       normal - which is the difference between acting now and waiting. Where a
       series exists, the tile carries its shape and its change. */
    const spark = it.series && it.series.length > 3
      ? `<svg class="tspark" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="${
          (() => {
            const ys = it.series.map(p => p[1]);
            const lo = Math.min(...ys), hi = Math.max(...ys, lo + 1);
            return it.series.map((p, i) =>
              `${i ? "L" : "M"}${(i / (it.series.length - 1) * 100).toFixed(1)},${(100 - (p[1] - lo) / (hi - lo) * 100).toFixed(1)}`).join(" ");
          })()}" fill="none" stroke="var(--accent)" stroke-width="1.5" vector-effect="non-scaling-stroke" opacity="0.75"/></svg>`
      : "";
    const t = el(`<div class="kpi ${it.state === "bad" ? "critical" : it.state === "warn" ? "problem" : ""}">
      <div class="k">${it.hintKey ? hint(it.label, it.hintKey) : esc(it.label)}</div>
      <div class="v">${esc(String(it.value))} <span class="muted" style="font-size:11px;font-weight:400">${esc(it.unit)}</span>${
        it.delta ? `<span class="delta ${it.deltaDir}">${esc(it.delta)}</span>` : ""}</div>
      ${spark}
      <div class="s">${statusEl(it.state, it.state === "ok" ? "ok" : it.why.length > 44 ? it.why.slice(0, 42) + "…" : it.why)}</div>
    </div>`);
    t.title = it.why;
    t.onclick = () => { FORCE_OPEN[it.key] = !FORCE_OPEN[it.key]; renderHealth(); };
    kpi.append(t);

    if (it.state !== "ok" || FORCE_OPEN[it.key]) {
      const { card: c, body } = card(it.label, `  ${statusEl(it.state, it.state)}`);
      body.append(it.detail());
      host.append(c);
    }
  }
  const v = document.getElementById("verdict");
  v.className = "pill " + (worst === 2 ? "bad" : worst === 1 ? "warn" : "ok");
  v.textContent = bad.length ? `${bad.length} to look at` : "healthy";
}

/* ---------- network (live queries) --------------------------------------- */
function isObserver(ip) { return (STATUS?.observer_dests || []).includes(ip); }
/* Show a configured name where there is one, and ALWAYS keep the address
   visible next to it - a friendly label that turns out to be attached to the
   wrong device is worse than no label, and this mapping is hand-written. */
function devName(ip) {
  const n = (STATUS?.device_names || {})[ip];
  return n ? `${esc(n)} <span class="muted" style="font-size:10px">${esc(ip)}</span>` : esc(ip);
}
const isLan = (ip) => /^(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/.test(ip || "");
const clock = (ms) => new Date(ms).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });

/* THE QUESTION THIS DASHBOARD IS ACTUALLY FOR: what is each device doing.
   Aggregate byte counts by IP answer a different question - useful for spotting
   volume anomalies, useless for "is the PC on Twitch right now". */
async function renderActivity() {
  const feed = document.getElementById("feed-body");
  const devs = document.getElementById("devices-body");
  if (!feed) return;

  /* live feed: most recent named connections, newest first */
  panel(feed, async () => {
    const r = await es(`${IDX}/_search`, {
      size: 50, sort: [{ "@timestamp": "desc" }],
      _source: ["@timestamp", "source.ip", "server.domain", "destination.ip",
                "destination.port", "client.bytes", "server.bytes"],
      query: { bool: {
        filter: [{ range: { "@timestamp": { gte: "now-" + RANGE } } }, { exists: { field: "server.domain" } }] } },
    });
    const rows = (r.hits?.hits || []).map(h => {
      const d = h._source, src = d.source?.ip || "?";
      /* NO BYTE COLUMN HERE, deliberately. The record that carries the domain is
         Zeek's ssl record and it has no byte fields at all - measured: 0 of 1412
         such documents had client.bytes, server.bytes, network.bytes or
         source.bytes. The bytes live on the separate conn record. Summing them
         here produced a confident "0 B" on every row, which is the exact failure
         this repo keeps meeting: a missing field rendering as a real-looking
         number. Port and address are actually present, so show those. */
      return {
        t: clock(Date.parse(d["@timestamp"])),
        who: devName(src),
        svc: esc(d.server?.domain || "") + (isObserver(d.destination?.ip) ? ` <span class="tag obs">observer</span>` : ""),
        dst: `${esc(d.destination?.ip || "")}<span class="muted">:${esc(d.destination?.port ?? "")}</span>`,
        drill: { field: "server.domain", value: d.server?.domain },
      };
    });
    return table([{ key: "t", label: "time", num: false }, { key: "who", label: "device", raw: true },
                  { key: "svc", label: "connected to", raw: true }, { key: "dst", label: "address", raw: true }],
                 rows, { empty: "no named connections in this window" });
  });

  /* per-device: what each LAN device talked to */
  panel(devs, async () => {
    /* NOT filtered on server.domain. The domain and the byte counts live on
       DIFFERENT documents, so filtering to the ones with a domain zeroes every
       byte total. Bucket all of the device's sessions, and let the svc sub-agg
       pick up only those that carry a domain. */
    const r = await es(`${IDX}/_search`, {
      size: 0,
      query: { bool: { filter: [{ range: { "@timestamp": { gte: "now-" + RANGE } } }] } },
      aggs: { dev: { terms: { field: "source.ip", size: 12, order: { _count: "desc" } },
              aggs: { svc: { terms: { field: "server.domain", size: 6 } },
                      up: { sum: { field: "client.bytes" } },
                      down: { sum: { field: "server.bytes" } } } } },
    });
    const wrap = document.createElement("div");
    const buckets = (r.aggregations?.dev?.buckets || []).filter(b => isLan(b.key));
    if (!buckets.length) return el(`<div class="empty">no LAN devices seen in this window</div>`);
    for (const b of buckets) {
      const row = el(`<div style="padding:7px 0;border-bottom:1px solid #21262d">
        <div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline">
          <b style="font-size:13px">${devName(b.key)}</b>
          <span class="muted" style="font-size:11px">${b.doc_count.toLocaleString()} sessions &middot; ${bytes(b.up.value || 0)} up / ${bytes(b.down.value || 0)} down</span>
        </div>
        <div style="margin-top:3px;font-size:11px;line-height:1.7"></div></div>`);
      const chips = row.querySelector("div:last-child");
      for (const sv of b.svc.buckets) {
        const c = el(`<span class="tag" style="background:#1f6feb22;color:var(--accent);cursor:pointer;margin:0 5px 0 0;
                        text-transform:none;font-size:11px;letter-spacing:0">${esc(sv.key)} <span class="muted">${sv.doc_count}</span></span>`);
        c.onclick = () => openDrill("server.domain", sv.key);
        chips.append(c);
      }
      const more = el(`<span class="muted" style="font-size:11px;cursor:pointer">all &rsaquo;</span>`);
      more.onclick = () => openDrill("source.ip", b.key);
      chips.append(more);
      wrap.append(row);
    }
    return wrap;
  });
}

async function termsPanel(body, { field, dataset, metric, label, valueFmt, extraFilter }) {
  const filter = [timeFilter()];
  if (dataset) filter.push({ term: { "event.dataset": dataset } });
  if (extraFilter) filter.push(...extraFilter);
  const aggs = metric
    ? { t: { terms: { field, size: 10, order: { m: "desc" } }, aggs: { m: { sum: { field: metric } } } } }
    : { t: { terms: { field, size: 10 } } };
  const r = await es(`${IDX}/_search`, { size: 0, query: { bool: { filter } }, aggs });
  const buckets = r.aggregations?.t?.buckets || [];
  return table(
    [{ key: "k", label: label || field, raw: true }, { key: "v", label: metric ? "bytes" : "count", num: true }],
    buckets.map(b => {
      const val = metric ? b.m.value : b.doc_count;
      const obs = isObserver(b.key);
      return {
        k: esc(b.key) + (obs ? `<span class="tag obs">observer</span>` : ""),
        v: valueFmt ? valueFmt(val) : val.toLocaleString(),
        bar: val, drill: { field, value: b.key },
      };
    }));
}

function renderNetwork() {
  const host = document.getElementById("network");
  host.innerHTML = "";

  /* "Now" is its own section, above the analysis tables, because it is the
     question a person actually arrives with: which of my devices is talking to
     what, at this moment. The aggregate tables answer a different and slower
     question and can wait below it. */
  const now = document.getElementById("now");
  now.innerHTML = "";
  const feed = card("live activity");
  feed.body.id = "feed-body"; feed.body.innerHTML = `<div class="muted">loading…</div>`;
  feed.card.style.gridColumn = "span 2";
  /* Bounded and scrolled, not unbounded. Fifty rows of feed pushed the analysis
     section a screen and a half down the page - the most recent line is the
     valuable one, so keep the card a fixed size and let it scroll internally. */
  feed.body.style.maxHeight = "420px";
  feed.body.style.overflowY = "auto";
  now.append(feed.card);

  const dev = card("devices");
  dev.body.id = "devices-body"; dev.body.innerHTML = `<div class="muted">loading…</div>`;
  dev.card.style.gridColumn = "span 2";
  now.append(dev.card);

  renderActivity();
  const mk = (title, note, fn) => {
    const { card: c, body } = card(title);
    host.append(c);
    panel(body, fn).then(() => { if (note) c.append(el(`<div class="sub">${note}</div>`)); });
  };

  /* Upload asymmetry is the interesting axis: normal browsing is download
     heavy, so a destination that RECEIVES far more than it sends is a backup,
     a sync client - or an exfiltration path. The observer tag matters here:
     unlabelled, the monitoring's own egress is the most alarming row present. */
  mk("upload destinations", "bytes sent from the network &middot; click a row to drill in", () =>
    termsPanel(null, { field: "destination.ip", metric: "client.bytes", label: "destination", valueFmt: bytes }));

  mk("top talkers", "local hosts by bytes sent", () =>
    termsPanel(null, { field: "source.ip", metric: "client.bytes", label: "source", valueFmt: bytes }));

  /* tls.client.server_name is mapped as text and never aggregates - it returns
     zero buckets with no error. server.domain is the one that works. */
  mk("TLS destinations", "server.domain &middot; SNI, not certificates", () =>
    termsPanel(null, { field: "server.domain", dataset: "ssl", label: "domain" }));

  mk("DNS names", "most queried", () =>
    termsPanel(null, { field: "dns.host", dataset: "dns", label: "name" }));

  mk("NXDOMAIN", "names that do not exist, asked repeatedly - always a misconfiguration", () =>
    termsPanel(null, {
      field: "dns.host", dataset: "dns", label: "name",
      extraFilter: [{ term: { "zeek.dns.rcode_name": "NXDOMAIN" } }],
    }));

  /* The half an NXDOMAIN leaderboard cannot see: an unanswered multicast query
     carries no rcode at all, so it never reaches that board. Measured here once
     at 8x the unicast volume. */
  mk("unanswered LLMNR / mDNS", "multicast name queries with no response - a name-spoofing foothold", async () => {
    const r = await es(`${IDX}/_search`, {
      size: 0, track_total_hits: true,
      query: { bool: {
        filter: [timeFilter(), { terms: { "destination.ip": ["224.0.0.252", "224.0.0.251"] } }],
        must_not: [{ exists: { field: "zeek.dns.rcode_name" } }] } },
      aggs: { t: { terms: { field: "source.ip", size: 6 } } },
    });
    const total = r.hits?.total?.value ?? 0;
    const wrap = document.createElement("div");
    wrap.append(el(`<div class="big" style="color:${total > 1000 ? "var(--warn)" : "var(--ok)"}">${total.toLocaleString()}</div>
      <div class="sub">unanswered queries in the last ${RANGE}</div>`));
    wrap.append(table([{ key: "k", label: "source" }, { key: "v", label: "count", num: true }],
      (r.aggregations?.t?.buckets || []).map(b => ({ k: b.key, v: b.doc_count.toLocaleString(), bar: b.doc_count,
        drill: { field: "source.ip", value: b.key } }))));
    return wrap;
  });

  mk("suricata alerts", "by rule", () =>
    termsPanel(null, { field: "rule.name", dataset: "alert", label: "rule" }));

  mk("destination ports", "where traffic is going", () =>
    termsPanel(null, { field: "destination.port", label: "port" }));
}

/* ---------- drill-down ---------------------------------------------------- */
async function openDrill(field, value) {
  const d = document.getElementById("drill");
  d.classList.add("open");
  document.getElementById("drill-title").textContent = `${field} = ${value}`;
  document.getElementById("drill-sub").textContent = `last ${RANGE}`;
  const body = document.getElementById("drill-body");
  body.innerHTML = `<div class="muted">querying…</div>`;

  try {
    const filter = [timeFilter(), { term: { [field]: value } }];
    const r = await es(`${IDX}/_search`, {
      size: 0, track_total_hits: true,
      query: { bool: { filter } },
      aggs: {
        peers_src: { terms: { field: "source.ip", size: 8 } },
        peers_dst: { terms: { field: "destination.ip", size: 8 } },
        ports: { terms: { field: "destination.port", size: 8 } },
        domains: { terms: { field: "server.domain", size: 8 } },
        up: { sum: { field: "client.bytes" } },
        down: { sum: { field: "server.bytes" } },
        /* Source-port cardinality is what separates a beacon from one long-lived
           connection: both look identical on a coverage histogram, but a beacon
           opens a new socket per check-in and burns ephemeral ports. */
        srcports: { cardinality: { field: "source.port" } },
        over_time: { date_histogram: { field: "@timestamp", fixed_interval: "30m", min_doc_count: 0 } },
      },
    });
    const a = r.aggregations, sessions = r.hits?.total?.value ?? 0;
    const up = a.up.value || 0, down = a.down.value || 0;
    const buckets = a.over_time.buckets || [];
    const covered = buckets.filter(b => b.doc_count > 0).length;

    const wrap = document.createElement("div");
    wrap.append(el(`<div class="grid">
      <div class="card"><h2>volume</h2>
        <div class="kv"><span>sessions</span><b>${sessions.toLocaleString()}</b></div>
        <div class="kv"><span>uploaded</span><b>${bytes(up)}</b></div>
        <div class="kv"><span>downloaded</span><b>${bytes(down)}</b></div>
        <div class="kv"><span>ratio up:down</span><b>${down ? (up / down).toFixed(2) : "&infin;"}</b></div>
        ${isObserver(value) ? `<div class="sub" style="color:var(--accent)">this is the monitoring's own egress (OBSERVER_DESTS)</div>` : ""}
      </div>
      <div class="card"><h2>periodicity</h2>
        <div class="kv"><span>30m buckets seen in</span><b>${covered} / ${buckets.length}</b></div>
        <div class="kv"><span>distinct source ports</span><b>${(a.srcports.value || 0).toLocaleString()}</b></div>
        <div class="sub">${
          covered / Math.max(1, buckets.length) > 0.9 && a.srcports.value > 50
            ? "present in nearly every bucket with many source ports - beacon-shaped"
            : covered / Math.max(1, buckets.length) > 0.9
            ? "present in nearly every bucket but reusing few ports - a long-lived connection, not a beacon"
            : "intermittent"}</div>
      </div></div>`));

    const spark = buckets.map(b => [b.key / 1000, b.doc_count]);
    const sc = el(`<div class="card" style="margin-top:12px"><h2>sessions over time</h2></div>`);
    sc.append(sparkline(spark, 0));
    wrap.append(sc);

    const g = el(`<div class="grid" style="margin-top:12px"></div>`);
    const addT = (title, buckets2, f) => {
      const { card: c, body: b } = card(title);
      b.append(table([{ key: "k", label: "value" }, { key: "v", label: "sessions", num: true }],
        (buckets2 || []).map(x => ({ k: x.key, v: x.doc_count.toLocaleString(), bar: x.doc_count,
          drill: f ? { field: f, value: x.key } : null }))));
      g.append(c);
    };
    addT("peer sources", a.peers_src.buckets, "source.ip");
    addT("peer destinations", a.peers_dst.buckets, "destination.ip");
    addT("ports", a.ports.buckets, null);
    addT("TLS domains", a.domains.buckets, null);
    wrap.append(g);

    wrap.append(el(`<div class="sub" style="margin-top:12px">
      open in Arkime:
      <a target="_blank" href="/arkime/sessions?expression=${encodeURIComponent(field + " == " + value)}&date=-1">full sessions and packets</a>
      &middot; ASN/organisation is current (DB-IP, monthly); <b>city and country come from a
      2019 database</b> and reallocated ranges resolve to their previous owners -
      confirm with RDAP before acting on a location
    </div>`));

    body.innerHTML = ""; body.append(wrap);
  } catch (e) {
    body.innerHTML = `<div class="err">drill-down failed: ${esc(e.message)}</div>`;
  }
}
function closeDrill() { document.getElementById("drill").classList.remove("open"); }
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrill(); });

/* ---------- refresh loop -------------------------------------------------- */
async function loadStatus() {
  try {
    const r = await fetch("status.json?t=" + Date.now(), { cache: "no-store" });
    STATUS = await r.json();
  } catch (e) { STATUS = null; }
  renderHealth();
  updateAge();
  /* The feed is the "live" part - refresh it on the same tick as the health
     data rather than only when the operator presses refresh. */
  if (document.getElementById("feed-body")) renderActivity();
}

function updateAge() {
  const a = document.getElementById("age");
  if (!STATUS) { a.textContent = "status unavailable"; a.className = "stale"; return; }
  const age = Math.round(Date.now() / 1000 - STATUS.generated);
  /* Say how old the data is rather than implying it is live. A page that stops
     updating silently is the same class of failure as a watcher that stops
     silently - and this deployment has enough of those. */
  a.textContent = `pipeline data ${dur(age)} old`;
  a.className = age > (STATUS.refresh_sec || 60) * 3 ? "stale" : "muted";
}

function start() {
  RANGE = document.getElementById("range").value;
  loadStatus(); renderNetwork();
  clearInterval(timer); clearInterval(tick);
  timer = setInterval(loadStatus, (STATUS?.refresh_sec || 60) * 1000);
  tick = setInterval(updateAge, 5000);
}
document.getElementById("range").onchange = () => { RANGE = document.getElementById("range").value; renderNetwork(); };
document.getElementById("refresh").onclick = () => { loadStatus(); renderNetwork(); };
start();
</script>
